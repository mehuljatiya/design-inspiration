<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designspiration Archive · Cashmere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEDE8;--paper-2:#E7E6E0;--card:#F6F5F1;--ink:#17171A;--muted:#6E6C64;
  --faint:#9C998E;--line:rgba(23,23,26,.13);--line-2:rgba(23,23,26,.08);
  --accent:#2C39FF;--accent-ink:#1A22B8;--accent-soft:rgba(44,57,255,.09);
  --display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}::selection{background:var(--accent);color:#fff}

.masthead{border-bottom:1.5px solid var(--ink);padding:22px clamp(16px,4vw,44px) 16px}
.mast-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,44px);letter-spacing:-.03em;line-height:.92;margin:0}
.wordmark .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ledger{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:right;line-height:1.7}
.ledger b{color:var(--ink);font-weight:700}
.mast-rule{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-top:14px;padding-top:8px;border-top:1px solid var(--line)}

.toolbar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,44px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 320px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:15px;height:15px;stroke:var(--muted)}
.search input{width:100%;font-family:var(--mono);font-size:13px;padding:11px 14px 11px 34px;border:1.5px solid var(--ink);border-radius:0;background:var(--card);color:var(--ink);outline:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{box-shadow:3px 3px 0 var(--accent)}
.seg{display:inline-flex;border:1.5px solid var(--ink);background:var(--card)}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.toolbtn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.toolbtn:hover{background:var(--ink);color:var(--paper)}

.shell{display:grid;grid-template-columns:248px 1fr;gap:0;align-items:start}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.rail{position:sticky;top:63px;align-self:start;border-right:1px solid var(--line);padding:18px clamp(12px,2vw,20px) 40px;max-height:calc(100vh - 63px);overflow:auto}
@media(max-width:900px){.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:12px}.rail .tagfilter{display:none}}
.rail-title{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.rail-title.mt{margin-top:22px}
.railrow{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap}
@media(min-width:901px){.railrow{flex-direction:column;overflow:visible}}
.cat{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border:0;background:transparent;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink);border-radius:2px;white-space:nowrap}
.cat:hover{background:var(--paper-2)}
.cat.on{background:var(--ink);color:var(--paper)}
.cat.on .cat-ct{color:var(--paper)}
.cat .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.cat .cat-nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.cat-ct{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tagfilter{display:flex;flex-wrap:wrap;gap:6px}
.tagf{font-family:var(--mono);font-size:11px;padding:4px 8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.tagf:hover{border-color:var(--accent);color:var(--accent-ink)}
.tagf.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tagf .n{opacity:.6;margin-left:4px}
.clearall{margin-top:16px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:none;border:0;cursor:pointer;padding:6px 8px}
.clearall:hover{text-decoration:underline}

.active{padding:12px clamp(16px,4vw,44px) 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.active .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.chip{font-family:var(--mono);font-size:11px;padding:5px 9px;border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-soft);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .x{font-weight:700}
.chip:hover{background:var(--accent);color:#fff}
.resmeta{padding:12px clamp(16px,4vw,44px) 4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* list rows */
.list{padding:6px clamp(16px,4vw,44px) 80px}
.group-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 6px;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.group-h .gt{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.group-h .gc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.group-h .gdot{width:11px;height:11px;border-radius:50%}
.entry{display:grid;grid-template-columns:44px 96px 1fr auto;gap:16px;align-items:start;padding:16px 6px;border-bottom:1px solid var(--line-2)}
.entry:hover{background:var(--card)}
.entry .idx{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:6px}
.entry .body{min-width:0}
.entry .ttl-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.entry .ttl{font-family:var(--display);font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.25}
.entry a.ttl:hover{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.entry .dom{font-family:var(--mono);font-size:11px;color:var(--faint)}
.entry .note{color:var(--muted);font-size:13.5px;font-style:italic;margin-top:3px}
.entry .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}
.tg:hover{border-color:var(--accent);color:var(--accent-ink)}
.tg.review{border-color:#C8862B;color:#9A6412;background:rgba(200,134,43,.08)}
.entry .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;white-space:nowrap;padding-top:4px}
.entry .catflag{font-family:var(--mono);font-size:10px;color:var(--faint);display:inline-flex;align-items:center;gap:5px;margin-top:2px;cursor:pointer}
.entry .catflag .d{width:7px;height:7px;border-radius:50%}
@media(max-width:640px){.entry{grid-template-columns:1fr}.entry .idx,.entry .rowthumb-wrap{display:none}.entry .meta{text-align:left;padding-top:6px}}

/* thumbnail primitive */
.thumb{position:relative;overflow:hidden;background:var(--c,#6E6C64);border-radius:3px;display:grid;place-items:center}
.thumb .mono{font-family:var(--display);font-weight:700;color:#fff;user-select:none;opacity:.92}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rowthumb{width:96px;height:68px}
.rowthumb .mono{font-size:26px}

/* gallery */
.gallery{padding:16px clamp(16px,4vw,44px) 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.gcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .18s,transform .18s}
.gcard:hover{box-shadow:5px 7px 0 var(--ink);transform:translate(-1px,-1px)}
.gcard .gthumb{width:100%;aspect-ratio:16/10}
.gcard .gthumb .mono{font-size:46px}
.gcard .gbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.gcard .gtop{display:flex;align-items:center;gap:7px}
.gcard .gcatdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;cursor:pointer}
.gcard .gcat{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .gttl{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard a.gttl:hover{color:var(--accent-ink)}
.gcard .gdom{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:auto}
.gcard .gtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;max-height:46px;overflow:hidden}
.gcard .gtags .tg{font-size:9.5px;padding:2px 6px}

.edit-in{font-family:var(--display);font-weight:600;font-size:15px;width:100%;border:1px solid var(--accent);padding:6px 8px;background:#fff;color:var(--ink);border-radius:3px;margin-bottom:4px}
.edit-tags{font-family:var(--mono);font-size:11px;width:100%;border:1px solid var(--line);padding:6px 8px;background:#fff;color:var(--muted);border-radius:3px}
.gcard.edited,.entry.edited{outline:2px solid var(--accent);outline-offset:-2px}
.edithint{padding:10px clamp(16px,4vw,44px);font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border-bottom:1px solid var(--line)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink);margin:0 0 6px}
.empty p{font-family:var(--mono);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:11px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.foot{border-top:1.5px solid var(--ink);padding:20px clamp(16px,4vw,44px);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* lightbox preview */
.lightbox{position:fixed;inset:0;background:rgba(23,23,26,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:200}
.lightbox.show{display:flex}
.lb-card{position:relative;background:var(--card);border:1.5px solid var(--ink);max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:8px 10px 0 rgba(23,23,26,.3)}
.lb-media{width:100%;aspect-ratio:16/10;background:var(--paper-2);overflow:hidden}
.lb-media img{width:100%;height:100%;object-fit:cover;display:block}
.lb-body{padding:20px 22px 22px}
.lb-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.lb-close:hover{background:var(--ink);color:var(--paper)}
.lb-cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;color:var(--muted)}
.lb-cat .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.lb-title{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.lb-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:0 0 10px}
.lb-note{color:var(--muted);font-size:13.5px;font-style:italic;margin:0 0 14px}
.lb-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.lb-tags span{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
.lb-open{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.lb-open:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <div class="mast-top">
    <div class="wordmark"><h1>Designspiration</h1><span class="sub">Archive · Cashmere</span></div>
    <div class="ledger"><div><b id="totCt">0</b> entries indexed</div><div id="range">—</div></div>
  </div>
  <div class="mast-rule"><span>Curated design references · #designspiration</span><span>self-contained · offline · portable</span></div>
</header>

<div class="toolbar">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="search titles, notes, tags, domains…" autocomplete="off">
  </label>
  <div class="seg" role="tablist">
    <button id="vGallery" class="on">Gallery</button>
    <button id="vGroup">By category</button>
    <button id="vDate">By date</button>
  </div>
  <button class="toolbtn" id="exportBtn">Export .md</button>
  <button class="toolbtn" id="editBtn">Edit</button>
  <button class="toolbtn" id="dlBtn" style="display:none">Download backup</button>
  <button class="toolbtn" id="clearSaved" style="display:none">Clear saved</button>
</div>

<div class="active" id="activeBar" style="display:none"><span class="lbl">Filters</span><span id="activeChips"></span></div>

<div class="shell">
  <aside class="rail">
    <p class="rail-title">Categories</p>
    <div class="railrow" id="catList"></div>
    <p class="rail-title mt tagfilter">Filter by tag</p>
    <div class="tagfilter tagfilter" id="tagList"></div>
    <button class="clearall" id="clearRail">Reset all filters</button>
  </aside>
  <main>
    <div class="resmeta" id="resMeta"></div>
    <div id="stage"></div>
  </main>
</div>

<footer class="foot"><span>Built from #designspiration · Nov 2024 – Jul 2026</span><span>Tap any card to preview · click a tag to filter</span></footer>
<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <div class="lb-card" role="dialog" aria-modal="true">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <div class="lb-media"><img id="lbImg" alt="" onerror="this.style.display='none'"></div>
    <div class="lb-body">
      <span class="lb-cat"><span class="d" id="lbCatDot"></span><span id="lbCatName"></span></span>
      <h3 class="lb-title" id="lbTitle"></h3>
      <p class="lb-sub" id="lbSub"></p>
      <p class="lb-note" id="lbNote" style="display:none"></p>
      <div class="lb-tags" id="lbTags"></div>
      <a class="lb-open" id="lbOpen" target="_blank" rel="noopener">Open link in new tab ↗</a>
    </div>
  </div>
</div>

async function ensurePasscode(){
  if(PASSCODE)return true;
  const p=prompt("Enter the shared edit passcode:");

  try{
    const{data,error}=await sb.rpc("check_passcode",{p_passcode:p});

const catList=document.getElementById("catList");
function renderRail(){
  catList.innerHTML="";
  CATS.forEach(c=>{const ct=DATA.filter(d=>d.c===c).length;if(!ct)return;
    const b=document.createElement("button");b.className="cat"+(state.cats.has(c)?" on":"");
    b.innerHTML=`<span class="dot" style="background:${catColor(c)}"></span><span class="cat-nm">${c}</span><span class="cat-ct">${ct}</span>`;
    b.onclick=()=>{state.cats.has(c)?state.cats.delete(c):state.cats.add(c);render();};catList.appendChild(b);});
  const tagCount={};DATA.forEach(d=>d.g.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));

function domainOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;}}
function initialOf(u){const d=domainOf(u).replace(/^m\./,"");return (d.replace(/[^a-z0-9]/gi,"")[0]||"?").toUpperCase();}
function escapeHtml(s){return(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function thumbHTML(d,cls){const col=catColor(d.c);
  return `<div class="thumb ${cls}" style="--c:${col}"><span class="mono">${initialOf(d.u)}</span><img loading="lazy" src="${THUMB_DIR}${d.thumb}" alt="" onerror="this.remove()"></div>`;}
function matches(d){
  if(state.cats.size&&!state.cats.has(d.c))return false;
  if(state.tags.size){for(const t of state.tags){if(!d.g.includes(t))return false;}}
  if(state.q){const q=state.q.toLowerCase();if(!(d.t+" "+d.u+" "+d.n+" "+d.c+" "+d.g.join(" ")).toLowerCase().includes(q))return false;}
  return true;
}
function idxOf(d){return DATA.indexOf(d);}
function editFields(d){const i=idxOf(d);
  return `<input class="edit-in" data-i="${i}" data-f="t" value="${escapeHtml(d.t)}" placeholder="title">`+
         `<input class="edit-tags" data-i="${i}" data-f="g" value="${escapeHtml(d.g.join(', '))}" placeholder="tags, comma, separated">`;}
function wireEdits(el){el.querySelectorAll("[data-f]").forEach(inp=>{
  inp.onclick=e=>e.stopPropagation();
  inp.oninput=()=>{const i=+inp.dataset.i;if(inp.dataset.f==="t"){DATA[i].t=inp.value;}
    else{DATA[i].g=inp.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);}
    edited.add(i);el.classList.add("edited");schedulePersist(i);updateMeta();};});}
function tagsHTML(d){return d.g.map(t=>`<button class="tg${t==='review'?' review':''}" data-tag="${t}">${t}</button>`).join("");}
function wireCard(el){
  el.querySelectorAll(".tg").forEach(t=>t.onclick=e=>{e.stopPropagation();const g=t.dataset.tag;state.tags.has(g)?state.tags.delete(g):state.tags.add(g);render();});
  el.querySelectorAll("[data-cat]").forEach(c=>c.onclick=e=>{e.stopPropagation();const cc=c.dataset.cat;state.cats.has(cc)?state.cats.delete(cc):state.cats.add(cc);render();});
  el.querySelectorAll(".lb-trigger").forEach(a=>{a.onclick=e=>{
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    e.preventDefault();openLightbox(DATA[+a.dataset.i]);};});
}
function openLightbox(d){
  const img=document.getElementById("lbImg");img.style.display="block";img.src=THUMB_DIR+d.thumb;
  document.getElementById("lbCatDot").style.background=catColor(d.c);
  document.getElementById("lbCatName").textContent=d.c;
  document.getElementById("lbTitle").textContent=d.t;
  document.getElementById("lbSub").textContent=domainOf(d.u)+" · "+d.d;
  const noteEl=document.getElementById("lbNote");
  if(d.n){noteEl.textContent="“"+d.n+"”";noteEl.style.display="block";}else{noteEl.style.display="none";}
  document.getElementById("lbTags").innerHTML=d.g.map(t=>`<span>${escapeHtml(t)}</span>`).join("");
  document.getElementById("lbOpen").href=d.u;
  document.getElementById("lightbox").classList.add("show");
}
function closeLightbox(){document.getElementById("lightbox").classList.remove("show");}
document.getElementById("lbClose").onclick=closeLightbox;
document.getElementById("lightbox").onclick=e=>{if(e.target.id==="lightbox")closeLightbox();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox();});
function listEntry(d,idx){const el=document.createElement("div");el.className="entry";const col=catColor(d.c);
  el.innerHTML=`<div class="idx">${String(idx).padStart(3,"0")}</div>
    <a class="rowthumb-wrap lb-trigger" data-i="${idxOf(d)}" href="${d.u}" target="_blank" rel="noopener">${thumbHTML(d,"rowthumb")}</a>
    <div class="body"><div class="ttl-row">${state.edit?`<div style="flex:1">${editFields(d)}</div>`:`<a class="ttl lb-trigger" data-i="${idxOf(d)}" href="${d.u}" target="_blank" rel="noopener">${escapeHtml(d.t)}</a><span class="dom">${domainOf(d.u)}</span>`}</div>
    ${d.n?`<div class="note">“${escapeHtml(d.n)}”</div>`:""}
    ${state.edit?"":`<div class="tags"><span class="catflag" data-cat="${d.c}"><span class="d" style="background:${col}"></span>${d.c}</span>${tagsHTML(d)}</div>`}</div>
    <div class="meta">${d.d}</div>`;
  if(edited.has(idxOf(d)))el.classList.add("edited");wireCard(el);if(state.edit)wireEdits(el);return el;}
function galleryCard(d){const el=document.createElement("div");el.className="gcard";const col=catColor(d.c);
  el.innerHTML=`<a class="lb-trigger" data-i="${idxOf(d)}" href="${d.u}" target="_blank" rel="noopener">${thumbHTML(d,"gthumb")}</a>
    <div class="gbody"><div class="gtop"><span class="gcatdot" data-cat="${d.c}" style="background:${col}"></span><span class="gcat" data-cat="${d.c}">${d.c}</span></div>
    ${state.edit?`<div class="editwrap">${editFields(d)}</div>`:`<a class="gttl lb-trigger" data-i="${idxOf(d)}" href="${d.u}" target="_blank" rel="noopener">${escapeHtml(d.t)}</a>`}
    ${d.n?`<div class="note" style="font-size:12px;margin:0">“${escapeHtml(d.n)}”</div>`:""}
    ${state.edit?"":`<div class="gtags">${tagsHTML(d)}</div>`}<div class="gdom">${domainOf(d.u)} · ${d.d}</div></div>`;
  if(edited.has(idxOf(d)))el.classList.add("edited");wireCard(el);if(state.edit)wireEdits(el);return el;}
function updateMeta(){const res=DATA.filter(matches);
  const vlabel=state.view==="gallery"?"gallery":(state.view==="group"?"grouped by category":"newest first");
  document.getElementById("resMeta").textContent=res.length+" of "+DATA.length+" entries · "+vlabel+(edited.size?" · "+edited.size+" edited":"");}
function render(){
  renderRail();renderActive();
  const stage=document.getElementById("stage");stage.innerHTML="";
  const res=DATA.filter(matches);
  updateMeta();
  if(!res.length){stage.innerHTML=`<div class="empty"><h3>Nothing matches yet</h3><p>Loosen the search or clear a filter.</p></div>`;return;}
  if(state.view==="gallery"){const g=document.createElement("div");g.className="gallery";res.forEach(d=>g.appendChild(galleryCard(d)));stage.appendChild(g);}
  else if(state.view==="group"){const wrap=document.createElement("div");wrap.className="list";let n=1;
    CATS.forEach(c=>{const inC=res.filter(d=>d.c===c);if(!inC.length)return;
      const h=document.createElement("div");h.className="group-h";
      h.innerHTML=`<span class="gdot" style="background:${catColor(c)}"></span><span class="gt">${c}</span><span class="gc">${inC.length}</span>`;
      wrap.appendChild(h);inC.forEach(d=>wrap.appendChild(listEntry(d,n++)));});stage.appendChild(wrap);}
  else{const wrap=document.createElement("div");wrap.className="list";let n=1;res.forEach(d=>wrap.appendChild(listEntry(d,n++)));stage.appendChild(wrap);}
}
function renderActive(){const bar=document.getElementById("activeBar"),wrap=document.getElementById("activeChips");wrap.innerHTML="";
  const chips=[];state.cats.forEach(c=>chips.push(["cat",c,c]));state.tags.forEach(t=>chips.push(["tag",t,"#"+t]));
  if(!chips.length){bar.style.display="none";return;}bar.style.display="flex";
  chips.forEach(([kind,val,label])=>{const b=document.createElement("button");b.className="chip";b.innerHTML=`${label}<span class="x">✕</span>`;
    b.onclick=()=>{kind==="cat"?state.cats.delete(val):state.tags.delete(val);render();};wrap.appendChild(b);});}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
function setView(v,btn){state.view=v;["vGallery","vGroup","vDate"].forEach(id=>document.getElementById(id).classList.remove("on"));btn.classList.add("on");render();}
document.getElementById("vGallery").onclick=e=>setView("gallery",e.target);
document.getElementById("vGroup").onclick=e=>setView("group",e.target);
document.getElementById("vDate").onclick=e=>setView("date",e.target);
document.getElementById("clearRail").onclick=()=>{state={q:"",cats:new Set(),tags:new Set(),view:state.view};document.getElementById("q").value="";render();};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
document.getElementById("exportBtn").onclick=()=>{const res=DATA.filter(matches);
  let md="# Designspiration Archive — Cashmere\n\n_"+res.length+" entries · exported "+new Date().toISOString().slice(0,10)+"_\n\n";
  const byCat={};res.forEach(d=>{(byCat[d.c]=byCat[d.c]||[]).push(d);});
  CATS.forEach(c=>{if(!byCat[c])return;md+="\n## "+c+" ("+byCat[c].length+")\n\n";
    byCat[c].forEach(d=>{md+="- ["+d.t+"]("+d.u+") — `"+d.g.join(", ")+"` · "+d.d;if(d.n)md+=" — _"+d.n+"_";md+="\n";});});
  navigator.clipboard.writeText(md).then(()=>toast("Markdown copied ("+res.length+")"),
    ()=>{const b=new Blob([md],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="designspiration-archive.md";a.click();toast("Downloaded .md");});};
document.getElementById("editBtn").onclick=async ()=>{
  if(!state.edit){const ok=await ensurePasscode();if(!ok)return;}
  state.edit=!state.edit;
  document.getElementById("editBtn").textContent=state.edit?"Done":"Edit";
  document.getElementById("editBtn").classList.toggle("on");
  document.getElementById("dlBtn").style.display=state.edit?"inline-block":"none";
  document.getElementById("clearSaved").style.display=state.edit?"inline-block":"none";render();};
document.getElementById("dlBtn").onclick=()=>{
  let doc="<!doctype html>\n"+document.documentElement.outerHTML;
  const safe=JSON.stringify(DATA).replace(/<\//g,"<\\/");   // avoid closing the <script> early
  // function replacement so $ in titles/urls is NOT treated as a special pattern
  doc=doc.replace(/\/\*DS\*\/[\s\S]*?\/\*DE\*\//, ()=>"/*DS*/"+safe+"/*DE*/");
  const blob=new Blob([doc],{type:"text/html"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="designspiration-archive.html";a.click();
  toast("Downloaded updated archive ("+edited.size+" edited)");};

// ---- autosave: local cache (offline fallback) + shared Supabase sync ----
const STORE_KEY="dsp_archive_v1";
let _pt=null;
const _dirty=new Set();
function schedulePersist(i){clearTimeout(_pt);_dirty.add(i);_pt=setTimeout(()=>{persist();pushRemote();},600);}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA.map(d=>({t:d.t,g:d.g}))));toast("Saved");}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(STORE_KEY);if(!s)return;const a=JSON.parse(s);
  if(Array.isArray(a)&&a.length===DATA.length){for(let i=0;i<a.length;i++){if(a[i]&&a[i].t!==undefined){DATA[i].t=a[i].t;DATA[i].g=a[i].g;}}}}catch(e){}}
async function pushRemote(){
  const idxs=[..._dirty];_dirty.clear();
  for(const i of idxs){const d=DATA[i];
    try{const{error}=await sb.rpc("upsert_link_edit",{p_url:d.u,p_title:d.t,p_tags:d.g,p_passcode:PASSCODE});
      if(error)toast("Sync failed — wrong passcode?");}
    catch(e){toast("Offline — saved locally only");}}}
async function loadRemote(){
  try{const{data,error}=await sb.rpc("get_link_edits");
    if(error||!data)return false;
    const byUrl={};data.forEach(r=>byUrl[r.url]=r);
    DATA.forEach((d,i)=>{const r=byUrl[d.u];if(r){d.t=r.title;d.g=r.tags||[];edited.add(i);}});
    return true;
  }catch(e){return false;}}
document.getElementById("clearSaved").onclick=()=>{try{localStorage.removeItem(STORE_KEY);}catch(e){}
  toast("Cleared local cache · reloading");setTimeout(()=>location.reload(),700);};

async function init(){loadSaved();await loadRemote();render();}
init();
</script>
</body></html>
