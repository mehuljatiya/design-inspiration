<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Design Vault · Inspiration for designers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B;--elev:#141416;--elev-2:#1B1B1E;--media:#212124;--sunk:#0F0F11;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --ink:#F4F4F5;--ink-2:#A1A1A6;--ink-3:#6B6B70;
  --accent:#5B6CFF;--accent-soft:rgba(91,108,255,.16);--amber:#E0A03D;
  --r-card:18px;--r-media:12px;--r-pill:999px;--r-chip:8px;
  --ease:cubic-bezier(.22,1,.36,1);--bar:57px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pad:clamp(16px,2.6vw,34px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ───────────── top bar ───────────── */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:0 var(--pad);min-height:var(--bar);background:rgba(10,10,11,.78);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:10px 0}
.brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(140deg,var(--accent),#9A4BFF);
  display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;letter-spacing:-.03em}
.brand .nm{font-weight:600;font-size:14.5px;letter-spacing:-.015em;white-space:nowrap}
.brand .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:rgba(255,255,255,.06);
  border:1px solid var(--line);padding:2px 7px;border-radius:var(--r-pill)}
@media(max-width:520px){.brand .nm{display:none}}

.seg{display:inline-flex;padding:3px;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:var(--r-pill);flex:0 0 auto}
.seg a,.seg button{font-size:12.5px;font-weight:500;color:var(--ink-2);padding:5px 13px;border:0;background:none;
  border-radius:var(--r-pill);cursor:pointer;transition:color .18s,background .18s;white-space:nowrap}
.seg a:hover,.seg button:hover{color:var(--ink)}
.seg .on{background:var(--ink);color:#0A0A0B;font-weight:600}
.bardiv{width:1px;height:20px;background:var(--line);flex:0 0 auto}

.tabs{display:flex;gap:4px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;font-size:13.5px;font-weight:500;color:var(--ink-2);background:none;border:0;
  padding:17px 10px 16px;cursor:pointer;white-space:nowrap;transition:color .18s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;
  background:var(--ink);transform:scaleX(0);transform-origin:center;transition:transform .24s var(--ease)}
.tab.on::after{transform:scaleX(1)}
.tab .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:5px}

.barright{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;padding:9px 0}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:2;pointer-events:none}
.search input{width:186px;font-size:13px;color:var(--ink);padding:8px 30px 8px 32px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:rgba(255,255,255,.05);outline:none;transition:width .22s var(--ease),border-color .18s,background .18s}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{width:246px;border-color:var(--line-2);background:var(--elev)}
.search kbd{position:absolute;right:9px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 4px;pointer-events:none}
.search input:focus~kbd,.search input:not(:placeholder-shown)~kbd{opacity:0}

.tbtn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);
  padding:8px 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:rgba(255,255,255,.05);
  cursor:pointer;transition:color .18s,background .18s,border-color .18s;white-space:nowrap}
.tbtn:hover{color:var(--ink);background:var(--elev-2);border-color:var(--line-2)}
.tbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.tbtn.on{background:var(--ink);color:#0A0A0B;border-color:var(--ink);font-weight:600}
.tbtn .badge{font-family:var(--mono);font-size:9.5px;background:var(--accent);color:#fff;border-radius:var(--r-pill);
  padding:1px 6px;line-height:1.5}
.tbtn.ghost{background:none}
/* laptop: drop the button labels so the bar stays a single row */
@media(max-width:1240px){
  .tbtn .lbl{display:none}
  .tbtn{padding:8px 11px}
  .search input{width:150px}
  .search input:focus{width:210px}
}
/* small laptop / tablet: tabs get their own row rather than squeezing */
@media(max-width:1024px){
  .topbar{gap:8px 12px;padding:0 var(--pad) 8px}
  .brand{padding:9px 0}
  .tabs{order:4;flex:1 1 100%;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
  .tab{padding:10px 9px 11px}
  .tab::after{bottom:3px;left:9px;right:9px}
  .search input,.search input:focus{width:100%}
  .search{flex:1 1 180px}
  .barright{flex:1 1 auto}
}
@media(max-width:720px){
  .topbar{gap:8px 10px;padding:0 var(--pad) 10px}
  .brand{padding:9px 0}
  .tab{padding:9px 8px 10px;font-size:13px}
  .tab::after{bottom:3px;left:8px;right:8px}
  .tabs{order:4;flex:1 1 100%;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
  .barright{order:5;flex:1 1 100%;margin-left:0;padding:0}
  .search{order:0;flex:1 1 auto}
  .search input,.search input:focus{width:100%}
  .search kbd{display:none}
}

/* ───────────── notice strip ───────────── */
.notice{display:flex;align-items:center;gap:12px;margin:14px var(--pad) 0;padding:11px 14px;
  background:var(--elev);border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.notice .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
  border:1px solid rgba(224,160,61,.4);background:rgba(224,160,61,.1);padding:3px 7px;border-radius:var(--r-pill)}
.notice b{color:var(--ink);font-weight:600}
.notice .go{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;
  background:none;border:0;cursor:pointer;font-size:13px;padding:0}
.notice .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:4px}
.notice .x:hover{color:var(--ink)}

/* ───────────── chips + result bar ───────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:14px var(--pad) 0}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 6px 5px 11px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--elev);color:var(--ink);cursor:pointer;transition:background .16s}
.chip:hover{background:var(--elev-2)}
.chip .d{width:7px;height:7px;border-radius:50%}
.chip .x{color:var(--ink-3);font-size:13px;line-height:1;padding:0 3px}
.chip:hover .x{color:var(--ink)}
.chip.reset{border-style:dashed;color:var(--ink-2);padding:5px 11px}

.resbar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:16px var(--pad) 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.resbar b{color:var(--ink-2);font-weight:500}

/* ───────────── grid + card ───────────── */
.stage{padding:0 var(--pad) 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:30px 22px;padding-top:18px}
@media(min-width:1560px){.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}

.card{display:flex;flex-direction:column;gap:13px;cursor:pointer;animation:pop .34s var(--ease) both;
  animation-delay:calc(var(--i,0)*22ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.shotwrap{--p:16px;position:relative;padding:var(--p);background:var(--elev);border:1px solid var(--line);
  border-radius:var(--r-card);transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease)}
.card:hover .shotwrap{background:var(--elev-2);border-color:var(--line-2);transform:translateY(-2px)}
.shot{position:relative;aspect-ratio:4/3;border-radius:var(--r-media);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c,#3A3A40) 20%,transparent),transparent 72%),var(--media);
  display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.card:hover .shot{transform:scale(1.015)}
.ph{display:flex;flex-direction:column;align-items:center;gap:9px;user-select:none;padding:12px;text-align:center}
.ph .ini{font-size:34px;font-weight:700;color:var(--c,#8A8A94);letter-spacing:-.03em;line-height:1}
.ph .dm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;
  display:block;opacity:0;transition:opacity .4s ease}
.shot img.on{opacity:1}

.badges{position:absolute;top:calc(var(--p) + 10px);left:calc(var(--p) + 10px);display:flex;gap:6px;z-index:2}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  padding:4px 7px;border-radius:var(--r-pill);background:rgba(10,10,11,.72);color:#EDEDEF;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.badge.rev{color:#F2C078;border-color:rgba(224,160,61,.45);background:rgba(48,33,10,.82)}
.badge svg{width:9px;height:9px;fill:currentColor}

.acts{position:absolute;top:calc(var(--p) + 10px);right:calc(var(--p) + 10px);display:flex;gap:6px;z-index:2;opacity:0;transform:translateY(-4px);
  transition:opacity .2s var(--ease),transform .2s var(--ease)}
.card:hover .acts,.card:focus-within .acts{opacity:1;transform:none}
.act{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(10,10,11,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#EDEDEF;cursor:pointer;transition:background .16s,color .16s}
.act:hover{background:#F4F4F5;color:#0A0A0B;border-color:#F4F4F5}
.act svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
@media(hover:none){.acts{opacity:1;transform:none}}

.meta{display:flex;gap:11px;align-items:flex-start;padding:0 3px}
.avatar{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;background:var(--c,#3A3A40);letter-spacing:-.02em}
.mtxt{min-width:0;flex:1}
.mttl{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .mttl{color:#fff}
.msub{font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub .dot{opacity:.5;margin:0 5px}

/* section headers (Categories / Sources views) */
.sec{display:flex;align-items:center;gap:10px;margin:36px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sec h2{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:0}
.sec .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.sec+.grid{padding-top:20px}

/* edit-mode inline fields */
.edit-in{width:100%;font-size:13.5px;font-weight:600;color:var(--ink);padding:7px 9px;border-radius:var(--r-chip);
  border:1px solid var(--accent);background:var(--sunk);outline:none;margin-bottom:5px}
.edit-tags{width:100%;font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:7px 9px;border-radius:var(--r-chip);
  border:1px solid var(--line-2);background:var(--sunk);outline:none}
.card.edited .shotwrap{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ───────────── filter panel ───────────── */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.18s}
.scrim.show{opacity:1;visibility:visible}
.panel{position:fixed;top:calc(var(--bar) + 8px);right:var(--pad);z-index:80;width:344px;max-height:calc(100vh - var(--bar) - 28px);
  display:flex;flex-direction:column;background:var(--elev);border:1px solid var(--line-2);border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);
  transform-origin:top right;transition:opacity .18s var(--ease),transform .2s var(--ease),visibility .18s}
.panel.show{opacity:1;visibility:visible;transform:none}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:13.5px;font-weight:600;margin:0}
.panel-h button{background:none;border:0;color:var(--ink-3);font-size:15px;cursor:pointer;padding:2px 4px}
.panel-h button:hover{color:var(--ink)}
.panel-b{overflow-y:auto;padding:6px 16px 14px;flex:1}
.fgroup{padding:14px 0 4px;border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:0}
.fgroup>h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.frow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;margin:0 -8px;border:0;background:none;
  color:var(--ink-2);font-size:13px;text-align:left;cursor:pointer;border-radius:8px;transition:background .14s,color .14s}
.frow:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.frow .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.frow .ck{width:15px;height:15px;border-radius:4px;border:1px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center}
.frow.on{color:var(--ink)}
.frow.on .ck{background:var(--accent);border-color:var(--accent)}
.frow.on .ck::after{content:"";width:8px;height:4.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;
  transform:rotate(-45deg) translateY(-1px)}
.tagsearch{width:100%;font-size:12.5px;color:var(--ink);padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--sunk);outline:none;margin-bottom:10px}
.tagsearch:focus{border-color:var(--line-2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:none;color:var(--ink-2);cursor:pointer;transition:.14s}
.pill:hover{border-color:var(--line-2);color:var(--ink)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:#C3CAFF}
.pill .n{opacity:.55;margin-left:5px}
.morebtn{margin-top:9px;font-size:12px;color:var(--ink-2);background:none;border:0;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.morebtn:hover{color:var(--ink)}
.panel-f{display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line)}
.panel-f button{flex:1;font-size:12.5px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer;border:1px solid var(--line-2);
  background:none;color:var(--ink-2);transition:.16s}
.panel-f button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.panel-f button.primary{background:var(--ink);color:#0A0A0B;border-color:var(--ink)}
.panel-f button.primary:hover{background:#fff}
@media(max-width:720px){
  .panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:84vh;border-radius:18px 18px 0 0;
    transform:translateY(14px);transform-origin:bottom center}
}

/* ───────────── detail overlay ───────────── */
.ov{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:clamp(12px,3vw,44px);background:rgba(6,6,7,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility .22s}
.ov.show{opacity:1;visibility:visible}
.ov-card{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.85fr);width:min(1080px,100%);
  max-height:100%;background:var(--elev);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.65);transform:scale(.97) translateY(8px);transition:transform .24s var(--ease)}
.ov.show .ov-card{transform:none}
.ov-media{position:relative;background:var(--sunk);display:grid;place-items:center;overflow:auto;min-height:220px}
.ov-media img,.ov-media video{width:100%;height:100%;max-height:80vh;object-fit:contain;display:block}
.ov-media .ph .ini{font-size:60px}
.ov-media .ph .dm{font-size:12px}
.ov-side{display:flex;flex-direction:column;padding:24px;overflow-y:auto;border-left:1px solid var(--line)}
.ov-cat{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.ov-cat .d{width:8px;height:8px;border-radius:50%}
.ov-side h2{font-size:21px;font-weight:600;letter-spacing:-.025em;line-height:1.25;margin:0 0 8px}
.ov-note{font-size:13.5px;color:var(--ink-2);font-style:italic;margin:0 0 16px;line-height:1.5}
.ov-rows{display:flex;flex-direction:column;gap:1px;margin:4px 0 18px;background:var(--line);border-radius:10px;overflow:hidden}
.ov-rows>div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--sunk);font-size:12.5px}
.ov-rows span{color:var(--ink-3)}
.ov-rows b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.ov-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.ov-tags button{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:none;color:var(--ink-2);cursor:pointer;transition:.14s}
.ov-tags button:hover{border-color:var(--line-2);color:var(--ink)}
.ov-tags button.rev{color:#F2C078;border-color:rgba(224,160,61,.35)}
.ov-edit{margin-bottom:18px}
.ov-acts{display:flex;gap:9px;margin-top:auto;padding-top:8px}
.obtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;
  padding:11px 14px;border-radius:10px;border:1px solid var(--line-2);background:none;color:var(--ink);cursor:pointer;transition:.16s}
.obtn:hover{background:rgba(255,255,255,.06)}
.obtn.primary{background:var(--ink);color:#0A0A0B;border-color:var(--ink)}
.obtn.primary:hover{background:#fff}
.ov-count{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-top:14px;text-align:center}
.ov-nav{position:relative;z-index:2;flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line-2);background:rgba(20,20,22,.9);color:var(--ink-2);cursor:pointer;transition:.16s}
.ov-nav:hover{background:var(--ink);color:#0A0A0B;border-color:var(--ink)}
.ov-nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.ov-close{position:absolute;top:16px;right:18px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line-2);background:rgba(20,20,22,.9);color:var(--ink-2);font-size:15px;cursor:pointer}
.ov-close:hover{background:var(--ink);color:#0A0A0B}
@media(max-width:880px){
  .ov{padding:0}
  .ov-card{grid-template-columns:1fr;grid-template-rows:auto 1fr;width:100%;height:100%;max-height:100%;border-radius:0;border:0;overflow-y:auto}
  .ov-media{max-height:46vh}
  .ov-media img,.ov-media video{max-height:46vh}
  .ov-side{border-left:0;border-top:1px solid var(--line)}
  .ov-nav{position:fixed;bottom:18px}
  .ov-nav.prev{left:18px}.ov-nav.next{right:18px}
}

/* ───────────── misc ───────────── */
.empty{padding:90px 20px;text-align:center}
.empty h3{font-size:17px;font-weight:600;margin:0 0 7px}
.empty p{font-size:13px;color:var(--ink-3);margin:0 0 18px}
.sentinel{height:8px}
.loading{display:flex;justify-content:center;padding:26px 0;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.toast{position:fixed;bottom:26px;left:50%;z-index:200;transform:translateX(-50%) translateY(14px);
  background:#F4F4F5;color:#0A0A0B;font-size:12.5px;font-weight:500;padding:11px 18px;border-radius:var(--r-pill);
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{border-top:1px solid var(--line);padding:22px var(--pad) 34px;display:flex;gap:14px;flex-wrap:wrap;
  justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
/* compact phone layout — placed last so it wins over the component defaults above */
@media(max-width:720px){
  .card .acts{display:none}                 /* tap opens the detail sheet instead */
  .resbar{font-size:9.5px;letter-spacing:.06em;gap:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 16px;padding-top:14px}
  .shotwrap{--p:12px;border-radius:15px}
  .sec{margin-top:28px}
  .notice{flex-wrap:wrap;font-size:12.5px}
  .foot{flex-direction:column;gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=s=>{const[y,m]=s.split("-");return MONTHS[+m-1]+" "+y;};
const fmtDay=s=>{const[y,m,d]=s.split("-");return MONTHS[+m-1]+" "+(+d)+", "+y;};

/* ───────────── helpers (carried over) ───────────── */
function domainOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;}}
function initialOf(u){const d=domainOf(u).replace(/^m\./,"");return (d.replace(/[^a-z0-9]/gi,"")[0]||"?").toUpperCase();}
function escapeHtml(s){return(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function idxOf(d){return DATA.indexOf(d);}
function editFields(d){const i=idxOf(d);
  return `<input class="edit-in" data-i="${i}" data-f="t" value="${escapeHtml(d.t)}" placeholder="title">`+
         `<input class="edit-tags" data-i="${i}" data-f="g" value="${escapeHtml(d.g.join(', '))}" placeholder="tags, comma, separated">`;}
function wireEdits(el){el.querySelectorAll("[data-f]").forEach(inp=>{
  inp.onclick=e=>e.stopPropagation();
  inp.oninput=()=>{const i=+inp.dataset.i;if(inp.dataset.f==="t"){DATA[i].t=inp.value;}
    else{DATA[i].g=inp.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);}
    edited.add(i);el.classList.add("edited");schedulePersist(i);};});}

/* platform of origin — drives the badge, the Sources view and the source filter */
const SRC=[
  {re:/(^|\.)(x|twitter)\.com$/,k:"X",v:false,n:"X"},
  {re:/instagram\.com$/,k:"IG",v:true,n:"Instagram"},
  {re:/(^|\.)linkedin\.com$/,k:"IN",v:false,n:"LinkedIn"},
  {re:/(youtube\.com|youtu\.be)$/,k:"YT",v:true,n:"YouTube"},
  {re:/vimeo\.com$/,k:"VM",v:true,n:"Vimeo"},
  {re:/dribbble\.com$/,k:"DR",v:false,n:"Dribbble"},
  {re:/behance\.net$/,k:"BE",v:false,n:"Behance"},
  {re:/medium\.com$/,k:"MD",v:false,n:"Medium"},
  {re:/(^|\.)github\.com$/,k:"GH",v:false,n:"GitHub"},
  {re:/figma\.com$/,k:"FIG",v:false,n:"Figma"}];
function srcOf(u){const h=domainOf(u);return SRC.find(s=>s.re.test(h))||null;}
const srcName=u=>{const s=srcOf(u);return s?s.n:"Websites";};
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function copy(text,msg){
  const done=()=>toast(msg||"Link copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback());}
  else fallback();
  function fallback(){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");done();}catch(e){toast("Copy failed");}a.remove();}
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove("show"),1800);}

/* ───────────── filtering ───────────── */
function matches(d){
  if(state.view==="review"&&!d.g.includes("review"))return false;
  if(state.cats.size&&!state.cats.has(d.c))return false;
  if(state.srcs.size&&!state.srcs.has(srcName(d.u)))return false;
  if(state.tags.size){for(const t of state.tags){if(!d.g.includes(t))return false;}}
  if(state.q){const q=state.q.toLowerCase();
    if(!(d.t+" "+d.u+" "+d.n+" "+d.c+" "+d.g.join(" ")).toLowerCase().includes(q))return false;}
  return true;
}
function results(){
  const r=DATA.filter(matches);
  if(state.sort==="old")r.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  else if(state.sort==="az")r.sort((a,b)=>a.t.localeCompare(b.t));
  else r.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  return r;
}
function facets(){
  const cat={},tag={},src={};
  DATA.forEach(d=>{cat[d.c]=(cat[d.c]||0)+1;src[srcName(d.u)]=(src[srcName(d.u)]||0)+1;
    d.g.forEach(t=>tag[t]=(tag[t]||0)+1);});
  return{cat,tag,src};
}
const activeCount=()=>state.cats.size+state.tags.size+state.srcs.size+(state.sort!=="new"?1:0);

/* ───────────── card ───────────── */
function card(d,i){
  const el=document.createElement("article");el.className="card";el.style.setProperty("--i",i%12);
  const col=catColor(d.c),gi=idxOf(d),s=srcOf(d.u);
  const badges=[];
  if(s)badges.push(`<span class="badge">${s.v?PLAY:""}${s.k}</span>`);   // platform mark
  if(d.g.includes("review"))badges.push(`<span class="badge rev">review</span>`);
  el.innerHTML=`<div class="shotwrap">
    <div class="shot" style="--c:${col}"><span class="ph"><span class="ini">${initialOf(d.u)}</span><span class="dm">${escapeHtml(domainOf(d.u))}</span></span><img loading="lazy" decoding="async" src="${THUMB_DIR}${d.thumb}" alt="" onload="this.classList.add('on')" onerror="this.remove()"></div>
    ${badges.length?`<div class="badges">${badges.join("")}</div>`:""}
    <div class="acts">
      <a class="act" href="${escapeHtml(d.u)}" target="_blank" rel="noopener" aria-label="Open link"><svg viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="M19 5 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></a>
      <button class="act" data-copy="${escapeHtml(d.u)}" aria-label="Copy link"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
    </div></div>
  <div class="meta">
    <span class="avatar" style="--c:${col}">${initialOf(d.u)}</span>
    <div class="mtxt">${state.edit?editFields(d):
      `<div class="mttl">${escapeHtml(d.t)}</div>
       <div class="msub">${escapeHtml(d.c)}<span class="dot">·</span>${fmt(d.d)}</div>`}</div>
  </div>`;
  if(state.edit&&edited.has(gi))el.classList.add("edited");   // only flag edits while editing
  el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=e=>{e.stopPropagation();copy(b.dataset.copy);});
  el.onclick=e=>{if(e.target.closest("a,button,input"))return;openOverlay(d);};
  if(state.edit)wireEdits(el);
  return el;
}

/* ───────────── progressive render ───────────── */
const BATCH=48;
let queue=[],grid=null,io=null;
function buildQueue(res){
  const q=[];
  if(state.view==="cats"){
    const seen=new Set();
    CATS.forEach(c=>{const inC=res.filter(d=>d.c===c);if(!inC.length)return;seen.add(c);
      q.push({h:`<span class="d" style="background:${catColor(c)}"></span><h2>${escapeHtml(c)}</h2>`});
      inC.forEach(d=>q.push({d}));});
    const rest=res.filter(d=>!seen.has(d.c));
    if(rest.length){q.push({h:`<h2>Uncategorised</h2>`});rest.forEach(d=>q.push({d}));}
  }else if(state.view==="sources"){
    const by={};res.forEach(d=>{const k=srcName(d.u);(by[k]=by[k]||[]).push(d);});
    Object.keys(by).sort((a,b)=>by[b].length-by[a].length||a.localeCompare(b)).forEach(k=>{
      q.push({h:`<h2>${escapeHtml(k)}</h2>`});
      by[k].forEach(d=>q.push({d}));});
  }else res.forEach(d=>q.push({d}));
  return q;
}
function paint(){
  const stage=$("stage"),old=stage.querySelector(".sentinel");
  if(old)old.remove();
  if(io)io.disconnect();
  let n=0;
  while(queue.length&&n<BATCH){
    const op=queue.shift();
    if(op.h){const h=document.createElement("div");h.className="sec";h.innerHTML=op.h;stage.appendChild(h);grid=null;}
    else{if(!grid){grid=document.createElement("div");grid.className="grid";stage.appendChild(grid);}
      grid.appendChild(card(op.d,n));n++;}
  }
  if(queue.length){
    const s=document.createElement("div");s.className="sentinel";stage.appendChild(s);
    if(!io)io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))paint();},{rootMargin:"700px 0px"});
    io.observe(s);
  }
}
function render(){
  syncTabs();renderNotice();renderChips();renderPanel();
  const res=results();updateMeta(res);
  const stage=$("stage");stage.innerHTML="";queue=[];grid=null;if(io)io.disconnect();
  if(!res.length){
    stage.innerHTML=`<div class="empty"><h3>Nothing matches</h3><p>Loosen the search or clear a filter.</p>
      <button class="tbtn" onclick="resetAll()">Reset all filters</button></div>`;
    return;
  }
  queue=buildQueue(res);paint();
}
function updateMeta(res){
  const label={latest:"Latest",cats:"By category",sources:"By source",review:"Needs review"}[state.view];
  const sortLbl={new:"newest first",old:"oldest first",az:"a–z"}[state.sort];
  $("resMeta").textContent=state.q?`Searching “${state.q}”`:(activeCount()?"Filtered":"");
  $("rangeMeta").textContent=label+" · "+sortLbl;
  $("applyBtn").textContent="Show results";
  const fc=activeCount();
  $("fCount").style.display=fc?"inline-block":"none";$("fCount").textContent=fc;
  $("filterBtn").classList.toggle("on",!!fc);
}

/* ───────────── tabs ───────────── */
function syncTabs(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.view===state.view));}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.view=t.dataset.view;window.scrollTo({top:0,behavior:"instant"});render();});

/* ───────────── notice strip ───────────── */
const NOTICE_KEY="dsp_notice_v2";
function renderNotice(){
  const wrap=$("noticeWrap"),n=DATA.filter(d=>d.g.includes("review")).length;
  if(!n||state.view==="review"||localStorage.getItem(NOTICE_KEY)==="off"){wrap.innerHTML="";return;}
  wrap.innerHTML=`<div class="notice"><span class="tag">Review</span>
    <span>Some saves still need a real title — social posts we couldn't read automatically.</span>
    <button class="go" id="noticeGo">Review them →</button>
    <button class="x" id="noticeX" aria-label="Dismiss">✕</button></div>`;
  $("noticeGo").onclick=()=>{state.view="review";render();};
  $("noticeX").onclick=()=>{try{localStorage.setItem(NOTICE_KEY,"off");}catch(e){}wrap.innerHTML="";};
}

/* ───────────── active chips ───────────── */
function renderChips(){
  const bar=$("activeChips");bar.innerHTML="";
  const chips=[];
  state.cats.forEach(c=>chips.push({kind:"cat",v:c,label:c,col:catColor(c)}));
  state.tags.forEach(t=>chips.push({kind:"tag",v:t,label:"#"+t}));
  state.srcs.forEach(s=>chips.push({kind:"src",v:s,label:s}));
  if(state.sort!=="new")chips.push({kind:"sort",v:"new",label:{old:"Oldest first",az:"A–Z"}[state.sort]});
  if(!chips.length){bar.style.display="none";return;}
  bar.style.display="flex";
  chips.forEach(c=>{
    const b=document.createElement("button");b.className="chip";
    b.innerHTML=`${c.col?`<span class="d" style="background:${c.col}"></span>`:""}${escapeHtml(c.label)}<span class="x">✕</span>`;
    b.onclick=()=>{
      if(c.kind==="cat")state.cats.delete(c.v);
      else if(c.kind==="tag")state.tags.delete(c.v);
      else if(c.kind==="src")state.srcs.delete(c.v);
      else state.sort="new";
      render();};
    bar.appendChild(b);});
  const r=document.createElement("button");r.className="chip reset";r.textContent="Reset all";
  r.onclick=resetAll;bar.appendChild(r);
}
function resetAll(){
  state.cats.clear();state.tags.clear();state.srcs.clear();state.sort="new";state.q="";
  $("q").value="";render();
}

/* ───────────── filter panel ───────────── */
let tagQuery="",showAllTags=false;
function renderPanel(){
  const f=facets(),body=$("panelBody");
  const sorts=[["new","Newest"],["old","Oldest"],["az","A–Z"]];
  let tags=Object.keys(f.tag).sort((a,b)=>f.tag[b]-f.tag[a]);
  if(tagQuery)tags=tags.filter(t=>t.includes(tagQuery.toLowerCase()));
  const shown=showAllTags?tags:tags.slice(0,36);
  const srcs=Object.keys(f.src).sort((a,b)=>f.src[b]-f.src[a]);
  body.innerHTML=`
    <div class="fgroup"><h4>Sort</h4><div class="pills">
      ${sorts.map(([k,l])=>`<button class="pill${state.sort===k?" on":""}" data-sort="${k}">${l}</button>`).join("")}
    </div></div>
    <div class="fgroup"><h4>Category<span>${state.cats.size?state.cats.size+" on":""}</span></h4>
      ${CATS.filter(c=>f.cat[c]).map(c=>`<button class="frow${state.cats.has(c)?" on":""}" data-cat="${escapeHtml(c)}">
        <span class="d" style="background:${catColor(c)}"></span><span class="nm">${escapeHtml(c)}</span>
        <span class="ck"></span></button>`).join("")}
    </div>
    <div class="fgroup"><h4>Tag<span>${state.tags.size?state.tags.size+" on":""}</span></h4>
      <input class="tagsearch" id="tagSearch" placeholder="Find a tag…" value="${escapeHtml(tagQuery)}" autocomplete="off">
      <div class="pills">${shown.map(t=>`<button class="pill${state.tags.has(t)?" on":""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("")||'<span style="color:var(--ink-3);font-size:12px">No tags match.</span>'}</div>
      ${tags.length>shown.length?`<button class="morebtn" id="moreTags">Show all tags</button>`:""}
    </div>
    <div class="fgroup"><h4>Source<span>${state.srcs.size?state.srcs.size+" on":""}</span></h4>
      <div class="pills">${srcs.map(s=>`<button class="pill${state.srcs.has(s)?" on":""}" data-src="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("")}</div>
    </div>`;
  body.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;render();});
  body.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{toggle(state.cats,b.dataset.cat);render();});
  body.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{toggle(state.tags,b.dataset.tag);render();});
  body.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{toggle(state.srcs,b.dataset.src);render();});
  const more=$("moreTags");if(more)more.onclick=()=>{showAllTags=true;renderPanel();};
  const ts=$("tagSearch");
  if(ts)ts.oninput=()=>{tagQuery=ts.value;const at=document.activeElement===ts;renderPanel();
    if(at){const el=$("tagSearch");el.focus();el.setSelectionRange(el.value.length,el.value.length);}};
}
function toggle(set,v){set.has(v)?set.delete(v):set.add(v);}
const panelOpen=()=>$("panel").classList.contains("show");
function openPanel(){$("panel").classList.add("show");$("scrim").classList.add("show");$("filterBtn").setAttribute("aria-expanded","true");}
function closePanel(){$("panel").classList.remove("show");$("scrim").classList.remove("show");$("filterBtn").setAttribute("aria-expanded","false");}
function togglePanel(){panelOpen()?closePanel():openPanel();}
$("filterBtn").onclick=togglePanel;
$("panelClose").onclick=closePanel;
$("scrim").onclick=closePanel;
$("applyBtn").onclick=closePanel;
$("resetAll").onclick=()=>{resetAll();};

/* ───────────── detail overlay ───────────── */
let ovList=[],ovPos=0;
const ovOpen=()=>$("ov").classList.contains("show");
function openOverlay(d){
  ovList=results();ovPos=Math.max(0,ovList.indexOf(d));
  paintOverlay();
  $("ov").classList.add("show");$("ov").setAttribute("aria-hidden","false");
  document.documentElement.style.overflow="hidden";
}
function closeOverlay(){
  $("ov").classList.remove("show");$("ov").setAttribute("aria-hidden","true");
  document.documentElement.style.overflow="";
  $("ovMedia").innerHTML="";
}
function step(n){if(!ovList.length)return;ovPos=(ovPos+n+ovList.length)%ovList.length;paintOverlay();}
function paintOverlay(){
  const d=ovList[ovPos];if(!d)return;
  const col=catColor(d.c);
  $("ovMedia").innerHTML=`<span class="ph" style="--c:${col}"><span class="ini">${initialOf(d.u)}</span><span class="dm">${escapeHtml(domainOf(d.u))}</span></span>
    <img src="${THUMB_DIR}${d.thumb}" alt="" style="position:absolute;inset:0;object-fit:contain" onerror="this.remove()">`;
  $("ovDot").style.background=col;
  $("ovCat").textContent=d.c;
  $("ovTitle").textContent=d.t;
  const note=$("ovNote");
  if(d.n){note.textContent="“"+d.n+"”";note.style.display="block";}else note.style.display="none";
  $("ovDate").textContent=fmtDay(d.d);
  $("ovDom").textContent=domainOf(d.u);
  const tw=$("ovTags");tw.innerHTML="";
  d.g.forEach(t=>{const b=document.createElement("button");b.className=t==="review"?"rev":"";b.textContent=t;
    b.onclick=()=>{toggle(state.tags,t);closeOverlay();render();};tw.appendChild(b);});
  $("ovOpen").href=d.u;
  $("ovCopy").onclick=()=>copy(d.u);
  const oe=$("ovEdit");
  if(state.edit){oe.style.display="block";oe.innerHTML=editFields(d);wireEdits(oe);$("ovTitle").style.display="none";}
  else{oe.style.display="none";oe.innerHTML="";$("ovTitle").style.display="";}
}
$("ovClose").onclick=closeOverlay;
$("ovPrev").onclick=()=>step(-1);
$("ovNext").onclick=()=>step(1);
$("ov").onclick=e=>{if(e.target.id==="ov")closeOverlay();};

/* ───────────── search + keys ───────────── */
let _qt=null;
$("q").addEventListener("input",e=>{const v=e.target.value;clearTimeout(_qt);
  _qt=setTimeout(()=>{state.q=v;render();},110);});
document.addEventListener("keydown",e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA)$/.test(t.tagName);
  if(e.key==="Escape"){if(ovOpen())closeOverlay();else if(panelOpen())closePanel();else if(typing)t.blur();return;}
  if(ovOpen()){
    if(e.key==="ArrowRight"&&!typing){e.preventDefault();step(1);}
    if(e.key==="ArrowLeft"&&!typing){e.preventDefault();step(-1);}
    return;
  }
  if(e.key==="k"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("q").focus();$("q").select();return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();}
  else if(e.key==="f"||e.key==="F"){e.preventDefault();togglePanel();}
});

/* ───────────── export · edit · backup ───────────── */
$("exportBtn").onclick=()=>{const res=results();
  let md="# Design Vault\n\n_Exported "+new Date().toISOString().slice(0,10)+"_\n\n";
  const byCat={};res.forEach(d=>{(byCat[d.c]=byCat[d.c]||[]).push(d);});
  CATS.forEach(c=>{if(!byCat[c])return;md+="\n## "+c+" ("+byCat[c].length+")\n\n";
    byCat[c].forEach(d=>{md+="- ["+d.t+"]("+d.u+") — `"+d.g.join(", ")+"` · "+d.d;if(d.n)md+=" — _"+d.n+"_";md+="\n";});});
  navigator.clipboard.writeText(md).then(()=>toast("Markdown copied ("+res.length+")"),
    ()=>{const b=new Blob([md],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="design-vault.md";a.click();toast("Downloaded .md");});};
$("editBtn").onclick=async ()=>{
  if(!state.edit){const ok=await ensurePasscode();if(!ok)return;}
  state.edit=!state.edit;
  $("editBtn").querySelector(".lbl").textContent=state.edit?"Done":"Edit";
  $("editBtn").classList.toggle("on",state.edit);
  $("dlBtn").style.display=state.edit?"inline-flex":"none";
  $("clearSaved").style.display=state.edit?"inline-flex":"none";
  render();
  if(ovOpen())paintOverlay();};
$("dlBtn").onclick=()=>{
  let doc="<!doctype html>\n"+document.documentElement.outerHTML;
  const safe=JSON.stringify(DATA).replace(/<\//g,"<\\/");   // avoid closing the <script> early
  // function replacement so $ in titles/urls is NOT treated as a special pattern
  doc=doc.replace(/\/\*DS\*\/[\s\S]*?\/\*DE\*\//, ()=>"/*DS*/"+safe+"/*DE*/");
  const blob=new Blob([doc],{type:"text/html"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="design-vault.html";a.click();
  toast("Downloaded updated vault");};

// ---- autosave: local cache (offline fallback) + shared Supabase sync ----
const STORE_KEY="dsp_archive_v1";
let _pt=null;
const _dirty=new Set();
function schedulePersist(i){clearTimeout(_pt);_dirty.add(i);_pt=setTimeout(()=>{persist();pushRemote();},600);}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA.map(d=>({t:d.t,g:d.g}))));toast("Saved");}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(STORE_KEY);if(!s)return;const a=JSON.parse(s);
  if(Array.isArray(a)&&a.length===DATA.length){for(let i=0;i<a.length;i++){if(a[i]&&a[i].t!==undefined){DATA[i].t=a[i].t;DATA[i].g=a[i].g;}}}}catch(e){}}
async function pushRemote(){
  const idxs=[..._dirty];_dirty.clear();
  for(const i of idxs){const d=DATA[i];
    try{const{error}=await sb.rpc("upsert_link_edit",{p_url:d.u,p_title:d.t,p_tags:d.g,p_passcode:PASSCODE});
      if(error)toast("Sync failed — wrong passcode?");}
    catch(e){toast("Offline — saved locally only");}}}
async function loadRemote(){
  try{const{data,error}=await sb.rpc("get_link_edits");
    if(error||!data)return false;
    const byUrl={};data.forEach(r=>byUrl[r.url]=r);
    DATA.forEach((d,i)=>{const r=byUrl[d.u];if(r){d.t=r.title;d.g=r.tags||[];edited.add(i);}});
    return true;
  }catch(e){return false;}}
$("clearSaved").onclick=()=>{try{localStorage.removeItem(STORE_KEY);}catch(e){}
  toast("Cleared local cache · reloading");setTimeout(()=>location.reload(),700);};

async function init(){loadSaved();render();await loadRemote();render();}
init();
</script>
<script type="module">
import autoAnimate from "https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.4/index.min.js";
["activeChips","noticeWrap"].forEach(id=>{
  const el=document.getElementById(id);
  if(el)autoAnimate(el,{duration:160});
});
</script>
